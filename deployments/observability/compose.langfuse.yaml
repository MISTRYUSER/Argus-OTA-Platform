# Merge with compose.yaml only when enabling the optional local Agent backend.
services:
  collector:
    command: ["--config=/etc/otelcol/config.yaml", "--config=/etc/otelcol/langfuse.yaml"]
    environment:
      LANGFUSE_AUTH_BASE64: ${LANGFUSE_AUTH_BASE64:?base64 project public:secret keys required}
    volumes:
      - ./collector-langfuse.yaml:/etc/otelcol/langfuse.yaml:ro
  clickhouse:
    profiles: [langfuse]
    image: clickhouse/clickhouse-server:25.12
    mem_limit: 1536m
    cpus: 1.5
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?required}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/local-memory.xml:/etc/clickhouse-server/config.d/local-memory.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  langfuse-worker:
    profiles: [langfuse]
    image: docker.langfuse.com/langfuse/langfuse-worker:4.56.0
    mem_limit: 768m
    cpus: 1.0
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      NODE_OPTIONS: --max-old-space-size=512
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:?dedicated langfuse database and user required}
      REDIS_CONNECTION_STRING: ${LANGFUSE_REDIS_URL:?existing Redis endpoint required}
      REDIS_KEY_PREFIX: "argus-langfuse:"
      SALT: ${LANGFUSE_SALT:?required}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?64 hex characters required}
      TELEMETRY_ENABLED: "false"
      NEXTAUTH_URL: http://localhost:3000
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?required}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: argus-langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:?dedicated bucket credentials required}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:?required}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_ENDPOINT:?existing MinIO internal endpoint required}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: argus-langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:?required}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:?required}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_ENDPOINT:?required}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  langfuse-web:
    profiles: [langfuse]
    image: docker.langfuse.com/langfuse/langfuse:4.56.0
    mem_limit: 1536m
    cpus: 1.0
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      clickhouse:
        condition: service_healthy
    ports: ["127.0.0.1:3000:3000"]
    environment:
      <<: *langfuse-env
      NODE_OPTIONS: --max-old-space-size=1024
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?required}
      LANGFUSE_INIT_ORG_ID: argus-local
      LANGFUSE_INIT_ORG_NAME: Argus Local
      LANGFUSE_INIT_PROJECT_ID: argus-eval
      LANGFUSE_INIT_PROJECT_NAME: Argus Evaluation
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?project public key required}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?project secret key required}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?initial local account email required}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Argus Local}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?initial local account password required}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_PUBLIC_ENDPOINT:?browser accessible MinIO endpoint required}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: ${LANGFUSE_S3_ENDPOINT:?required}
volumes:
  clickhouse-data: {}
