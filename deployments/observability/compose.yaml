name: argus-observability
services:
  collector-storage-init:
    image: busybox:1.37.0
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    command: ["chown", "-R", "10001:10001", "/var/lib/otelcol"]
    volumes: ["collector-data:/var/lib/otelcol"]
    restart: "no"
  collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    user: "10001:10001"
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      ARGUS_NAMESPACE: ${ARGUS_NAMESPACE:-argus}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-argus-ai-agent}
    ports: ["127.0.0.1:4318:4318"]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
      - ${ARGUS_LOG_DIR:-./logs}:/var/log/argus:ro
      - collector-data:/var/lib/otelcol
    depends_on:
      collector-storage-init:
        condition: service_completed_successfully
      loki:
        condition: service_started
      tempo:
        condition: service_started
  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro", "prometheus-data:/prometheus"]
  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports: ["127.0.0.1:3100:3100"]
    volumes: ["./loki.yaml:/etc/loki/loki.yaml:ro", "loki-data:/loki"]
  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports: ["127.0.0.1:3200:3200"]
    volumes: ["./tempo.yaml:/etc/tempo/tempo.yaml:ro", "tempo-data:/var/tempo"]
  grafana:
    image: grafana/grafana:13.2.3
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]
volumes:
  collector-data: {}
  prometheus-data: {}
  loki-data: {}
  tempo-data: {}
  grafana-data: {}
